spring:
  application:
    name: ricozknow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-damk53uk1f9s739bvnj0-a:5432/ricozknow}
    username: ${SPRING_DATASOURCE_USERNAME:ricozknow}
    password: ${SPRING_DATASOURCE_PASSWORD:8bghBwvwdfMoDXHz2GWcFswnzgiK370z}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:rz-redis}
      port: ${REDIS_PORT:6379}

opensearch:
  host: ${OPENSEARCH_HOST:rz-opensearch}
  port: ${OPENSEARCH_PORT:26203}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USERNAME:}
  password: ${OPENSEARCH_PASSWORD:}

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://rz-minio:9000}
    bucket: ${S3_BUCKET:ricozknow-assets}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}

ricozknow:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_IN_PROD_use_a_256_bit_secret_minimum}
      access-token-ttl-minutes: 30
      refresh-token-ttl-days: 14
      refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false} # only ever set to false for local http-only dev; never in production
    login-rate-limit:
      max-attempts: 5
      window-minutes: 15
    rate-limits:
      search:
        max-requests: 30
        window-seconds: 60
      asset-upload:
        max-requests: 20
        window-seconds: 60
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  tenant:
    base-domain: ${TENANT_BASE_DOMAIN:ricozknow.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_METRICS_URL:http://ricozknow-otel-collector:4318/v1/metrics}
        step: ${OTEL_METRICS_STEP:30s}
    tracing:
      endpoint: ${OTEL_TRACING_ENDPOINT:http://ricozknow-otel-collector:4318/v1/traces}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ricozknow: INFO
    org.springframework.security: INFO
    software.amazon.awssdk: INFO
